# Build → verify (D3) → push → keyless-sign a curated conda-forge env image.
#
# Adapted from aarchbio's publish.yml for the ENV model (DESIGN D2): the unit of
# work is a curated env spec (envs/<name>.yaml), not a single bioconda pkg=version.
#
# The geospatial head is arch-specific as a whole (gdal/proj/geos are native libs),
# so v1 builds the arm64 leg natively on an arm64 runner (NO QEMU — D1). amd64
# already assembles upstream via conda/pip; this fills the arm64 gap fieldwork hit.
#
# D3 is enforced by build-env.sh itself: it runs the in-image smoke test and exits
# non-zero (failing the job) unless the env imports + does real work. "Verified" is
# earned in the build, not asserted by the tag.
#
# SAFETY: set-public is OFF by default. CI builds + signs into the (private) repo;
# making it public is a deliberate, separate action (set_public=true), so nothing
# reaches the world unattended before the org/domain go-live is confirmed.

name: publish

on:
  workflow_dispatch:
    inputs:
      envs:
        description: 'Space-separated env names (e.g. "geospatial earth-observation")'
        required: true
        default: 'geospatial'
        type: string
      set_public:
        description: 'Flip the repo public after signing (default false)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write   # commit the refreshed envs/<name>.lock.txt back to main
  id-token: write   # cosign keyless (OIDC)

env:
  REGISTRY: quay.io/aarchsci

jobs:
  # Split the space-separated env list into a JSON array for the matrix.
  prep:
    runs-on: ubuntu-24.04-arm
    outputs:
      envs: ${{ steps.j.outputs.envs }}
    steps:
      - id: j
        run: |
          set -uo pipefail
          arr=()
          for e in ${{ inputs.envs }}; do arr+=("\"$e\""); done
          join() { local IFS=,; echo "[$*]"; }
          echo "envs=$(join "${arr[@]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    if: ${{ needs.prep.outputs.envs != '[]' }}
    runs-on: ubuntu-24.04-arm    # native arm64 — no emulation (D1)
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.prep.outputs.envs) }}
    # ONE PUBLISH PER ENV AT A TIME (issue #51). Before this, a reconcile-dispatched run
    # and a manual run could publish the same env concurrently: both pushed `latest`, so
    # whichever finished LAST won — including an image built from the older spec — and
    # both committed that env's lock, so one rebase conflicted and aborted. The group is
    # per env, so different envs still build in parallel. cancel-in-progress is false so
    # a running publish is never killed mid-push; GitHub keeps at most one pending job per
    # group and a newer one replaces it, which is safe ONLY because of the checkout below.
    concurrency:
      group: publish-env-${{ matrix.env }}
      cancel-in-progress: false
    steps:
      # Check out the branch HEAD at job start, NOT the dispatch-time SHA (the default).
      # Load-bearing together with the concurrency group above: a job that waited behind
      # another publish of the same env would otherwise build the commit that existed when
      # it was DISPATCHED, and could republish an older spec over a newer one that landed
      # while it queued. Building the current head means the last publish to run is always
      # the newest spec, so `latest` cannot regress. Its lock commit compares against the
      # same head, so the "unchanged lock-hash -> no commit" gate stays correct.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - name: Login
        run: echo "${{ secrets.QUAY_TOKEN }}" | docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin

      - name: Build + verify (D3) + push, then keyless-sign
        env:
          PUSH: '1'
          COSIGN_YES: 'true'
        run: |
          set -uo pipefail
          out="$(mktemp)"
          # build-env.sh runs the smoke test and exits non-zero if the env doesn't
          # assemble/work on arm64 — that failure fails this job (D3 gate).
          GITHUB_OUTPUT="$out" ./builder/build-env.sh "${{ matrix.env }}"
          pinned="$(grep '^pinned=' "$out" | cut -d= -f2-)"
          [ -n "$pinned" ] || { echo "no digest — build/push did not complete"; exit 1; }
          echo "signing $pinned"
          cosign sign --yes "$pinned"

      # Hand the lock the build actually produced to the commit-locks job. This is NOT
      # bookkeeping — it is what makes the reconciler work at all: reconcile.yml decides
      # "has the channel moved?" by diffing a fresh solve against the COMMITTED lock-hash
      # (OQ4). A lock that never lands leaves that env reading as drifted, so it rebuilds
      # every day. (geospatial's committed lock sat at c35344f5346d for ~40 days that way.)
      #
      # Uploaded as an artifact rather than pushed from here (issue #58). Each leg used to
      # commit and push its own lock, racing up to 29 others onto main with 5 retries, and
      # once nearly every env drifted daily (zstd 1.6.0 et al.) one or two legs per run
      # exhausted their retries: pathology+pic on 11-25, geoscience on 11-26, astro on
      # 11-27. One writer after the matrix has no race to lose.
      #
      # Runs after build/push/sign so an uploaded lock always corresponds to an image that
      # passed D3 AND shipped, but BEFORE the visibility flip, deliberately: a failed
      # cosmetic flip must not lose the lock (it happened on dft's first publish, a 403).
      - name: Upload the lock for commit-locks
        uses: actions/upload-artifact@v4
        with:
          name: lock-${{ matrix.env }}
          path: envs/${{ matrix.env }}.lock.txt
          retention-days: 3
          if-no-files-found: error

      # Last, because it is the only step that changes nothing about the artifact.
      # Quay creates repos private; going public stays a deliberate opt-in (SAFETY note
      # at the top of this file). Whatever this step reports, the image is already built,
      # pushed and signed, so the fix is never to rebuild.
      #
      # This step's 403 hint used to say "re-mint the token in Quay", which was wrong and
      # cost real time: when it fired on 2026-09-04 the org already had an admin-scoped
      # token — the stale thing was the GitHub Actions SECRET, holding an older value.
      # Check the cheap, likely cause before the expensive, unlikely one.
      - name: Set repo public (only if explicitly requested)
        if: ${{ inputs.set_public == 'true' }}
        env:
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $QUAY_OAUTH_TOKEN" -H 'Content-Type: application/json' \
            -d '{"visibility":"public"}' \
            "https://quay.io/api/v1/repository/aarchsci/${{ matrix.env }}/changevisibility")"
          [ "$code" = "200" ] && { echo "public ✓"; exit 0; }
          echo "::error::changevisibility HTTP $code for ${{ matrix.env }} — image IS published+signed but still private."
          if [ "$code" = "403" ]; then
            echo "::error::403 = the QUAY_OAUTH_TOKEN this workflow received is not admin-scoped on the aarchsci org. Check in this order:"
            echo "::error::  1. Is the SECRET stale? Compare \`gh secret list\` against the working token in .env; if .env's token can flip a repo public locally, just re-set the secret from it. This was the actual cause on 2026-09-04."
            echo "::error::  2. Does the secret have a trailing newline? Set it with --body \"\$(...)\", not a stdin redirect — a newline fails with this same 403."
            echo "::error::  3. Only if both check out, re-mint in Quay (Applications -> Generate Token) with repo:admin."
            echo "::error::In every case the image for ${{ matrix.env }} is published and signed already; flip visibility and move on, do not rebuild."
          fi
          exit 1

  # The ONE job that writes to main for a publish run: the locks the matrix produced, then
  # the doc counts derived from them. Previously each build leg pushed its own lock and a
  # separate sync-docs job pushed the counts. With up to 29 legs racing onto main, one or
  # two per run lost the race and their locks never landed (issue #58).
  #
  # `!cancelled()` rather than `success()` on purpose: if one env fails D3, the others still
  # shipped and their locks must still land. A failed leg uploads no lock, so nothing about
  # it is committed.
  #
  # The doc counts exist because counts in README/llms.txt/index.html used to be
  # hand-written and rotted silently as the channel moved. publish.yml is the only workflow
  # that writes locks, so deriving the counts here covers the whole mechanism.
  commit-locks:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    # Serialized across runs: two publish runs finishing together would otherwise race each
    # other the same way the legs used to. A newer pending job replaces an older one, which
    # is safe because each run's artifacts belong to that run and are applied only if their
    # lock-hash differs from what main already has.
    concurrency:
      group: publish-commit-locks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: lock-*
          path: ${{ runner.temp }}/locks
          merge-multiple: true
      - name: Commit changed locks and doc counts in one push
        env:
          LOCKS: ${{ runner.temp }}/locks
        run: |
          set -uo pipefail
          git config user.name  'aarchsci-bot'
          git config user.email 'aarchsci-bot@users.noreply.github.com'
          lock_hash_of() { grep -m1 'lock-hash:' | sed -E 's/.*lock-hash: *([0-9a-f]+).*/\1/'; }

          # Gate on the LOCK-HASH, not file content: the header carries `Built:` and
          # `Builder:`, so the file differs on every rebuild even when the resolved set is
          # identical. OQ4 defines "changed" as lock-hash drift.
          changed=()
          for f in "$LOCKS"/*.lock.txt; do
            [ -e "$f" ] || { echo "no lock artifacts (every leg failed?)"; break; }
            name="$(basename "$f")"; env_name="${name%.lock.txt}"
            new="$(lock_hash_of < "$f")"
            old="$(lock_hash_of < "envs/$name" 2>/dev/null || true)"
            if [ -n "$old" ] && [ "$old" = "$new" ]; then
              echo "$env_name: lock-hash unchanged ($new)"; continue
            fi
            cp "$f" "envs/$name"
            pkgs="$(grep -m1 'lock-hash:' "$f" | sed -E 's/.*packages: *([0-9]+).*/\1/')"
            echo "::notice::$env_name: ${old:-none} -> $new ($pkgs pkgs)"
            changed+=("$env_name -> s$new ($pkgs pkgs)")
          done

          if [ "${#changed[@]}" -gt 0 ]; then
            git add -- envs/*.lock.txt
            git commit -q -m "lock: ${#changed[@]} env(s) refreshed" \
              -m "$(printf '%s\n' "${changed[@]}")" \
              -m "Resolved sets drifted on conda-forge linux-aarch64; rebuilt, D3-verified, signed, published. Automated by publish.yml."
          fi

          python3 builder/sync-doc-counts.py
          if ! git diff --quiet -- README.md docs/llms.txt docs/index.html; then
            git add -- README.md docs/llms.txt docs/index.html
            git commit -q -m "docs: sync package counts to the committed locks" \
                          -m "Generated by builder/sync-doc-counts.py from envs/*.lock.txt. Automated by publish.yml."
          fi

          if [ "$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD")" = "0" ]; then
            echo "nothing to commit"; exit 0
          fi
          # Single writer per run, serialized across runs, so a rejection now means a human
          # pushed meanwhile. Each lock file is owned by exactly one env, so rebases resolve.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::notice::pushed ${#changed[@]} lock(s) and doc counts on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/${GITHUB_REF_NAME}"
            git fetch -q origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; echo "::error::rebase conflict"; exit 1; }
            sleep $(( attempt * 5 ))
          done
          echo "::error::exhausted push retries — these envs will read as drifted tomorrow: ${changed[*]}"
          exit 1
