# Build → verify (D3) → push → keyless-sign a curated conda-forge env image.
#
# Adapted from aarchbio's publish.yml for the ENV model (DESIGN D2): the unit of
# work is a curated env spec (envs/<name>.yaml), not a single bioconda pkg=version.
#
# The geospatial head is arch-specific as a whole (gdal/proj/geos are native libs),
# so v1 builds the arm64 leg natively on an arm64 runner (NO QEMU — D1). amd64
# already assembles upstream via conda/pip; this fills the arm64 gap fieldwork hit.
#
# D3 is enforced by build-env.sh itself: it runs the in-image smoke test and exits
# non-zero (failing the job) unless the env imports + does real work. "Verified" is
# earned in the build, not asserted by the tag.
#
# SAFETY: set-public is OFF by default. CI builds + signs into the (private) repo;
# making it public is a deliberate, separate action (set_public=true), so nothing
# reaches the world unattended before the org/domain go-live is confirmed.

name: publish

on:
  workflow_dispatch:
    inputs:
      envs:
        description: 'Space-separated env names (e.g. "geospatial earth-observation")'
        required: true
        default: 'geospatial'
        type: string
      set_public:
        description: 'Flip the repo public after signing (default false)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write   # commit the refreshed envs/<name>.lock.txt back to main
  id-token: write   # cosign keyless (OIDC)

env:
  REGISTRY: quay.io/aarchsci

jobs:
  # Split the space-separated env list into a JSON array for the matrix.
  prep:
    runs-on: ubuntu-24.04-arm
    outputs:
      envs: ${{ steps.j.outputs.envs }}
    steps:
      - id: j
        run: |
          set -uo pipefail
          arr=()
          for e in ${{ inputs.envs }}; do arr+=("\"$e\""); done
          join() { local IFS=,; echo "[$*]"; }
          echo "envs=$(join "${arr[@]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    if: ${{ needs.prep.outputs.envs != '[]' }}
    runs-on: ubuntu-24.04-arm    # native arm64 — no emulation (D1)
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.prep.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - name: Login
        run: echo "${{ secrets.QUAY_TOKEN }}" | docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin

      - name: Build + verify (D3) + push, then keyless-sign
        env:
          PUSH: '1'
          COSIGN_YES: 'true'
        run: |
          set -uo pipefail
          out="$(mktemp)"
          # build-env.sh runs the smoke test and exits non-zero if the env doesn't
          # assemble/work on arm64 — that failure fails this job (D3 gate).
          GITHUB_OUTPUT="$out" ./builder/build-env.sh "${{ matrix.env }}"
          pinned="$(grep '^pinned=' "$out" | cut -d= -f2-)"
          [ -n "$pinned" ] || { echo "no digest — build/push did not complete"; exit 1; }
          echo "signing $pinned"
          cosign sign --yes "$pinned"

      # Commit the lock the build actually produced. This is NOT bookkeeping — it is
      # what makes the reconciler work at all: reconcile.yml decides "has the channel
      # moved?" by diffing a fresh solve against the COMMITTED lock-hash (OQ4). If the
      # lock never lands on main, that baseline is frozen at the day the env was first
      # built, every reconcile run sees drift forever, and all six envs get rebuilt and
      # republished daily. (That is exactly what happened: geospatial's committed
      # lock-hash sat at c35344f5346d/123 pkgs while the registry moved on for ~40 days.)
      #
      # Runs after build/push/sign so a committed lock always corresponds to an image
      # that passed D3 AND actually shipped (build-env.sh wrote the file in step 4),
      # but BEFORE the visibility flip — deliberately. Registry visibility is orthogonal
      # to what was built: an image is shipped and signed by the time we get here. Having
      # the lock commit sit downstream of set-public means a failed cosmetic flip skips
      # it and silently re-arms the daily-rebuild loop this step exists to prevent. That
      # is not hypothetical — it happened on dft's first publish (changevisibility 403).
      - name: Commit the refreshed lock
        run: |
          set -uo pipefail
          LOCK="envs/${{ matrix.env }}.lock.txt"
          lock_hash_of() { grep -m1 'lock-hash:' | sed -E 's/.*lock-hash: *([0-9a-f]+).*/\1/'; }

          # Gate on the LOCK-HASH, not on file content. The lock header also carries
          # `Built: <date>` and `Builder: <sha>`, so the file differs on every rebuild
          # even when the resolved package set is byte-identical — gating on `git diff`
          # would commit empty-meaning churn on any manual re-dispatch. OQ4 defines
          # "changed" as lock-hash drift, so that is what we commit on.
          hash="$(lock_hash_of < "$LOCK")"
          pkgs="$(grep -m1 'lock-hash:' "$LOCK" | sed -E 's/.*packages: *([0-9]+).*/\1/')"
          committed="$(git show "HEAD:$LOCK" 2>/dev/null | lock_hash_of || true)"

          if [ -n "$committed" ] && [ "$committed" = "$hash" ]; then
            echo "lock-hash unchanged ($hash) — resolved set identical, nothing to commit"
            git checkout -- "$LOCK" || true   # drop the date/sha-only header churn
            exit 0
          fi
          echo "::notice::$LOCK drifted: ${committed:-none} -> $hash; committing the new baseline."
          git --no-pager diff --stat -- "$LOCK" || true

          git config user.name  'aarchsci-bot'
          git config user.email 'aarchsci-bot@users.noreply.github.com'

          git add -- "$LOCK"
          git commit -q -m "lock: ${{ matrix.env }} -> s${hash} (${pkgs} pkgs)" \
                        -m "Resolved set drifted on conda-forge linux-aarch64; rebuilt, D3-verified, signed, published. Automated by publish.yml."

          # The matrix runs up to 6 envs concurrently and each pushes to main, so a
          # non-fast-forward is expected, not exceptional. Each leg touches only its
          # own lock file, so a rebase always resolves cleanly — retry rather than fail
          # (a lost push would silently re-arm the daily-rebuild loop for that env).
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "::notice::pushed lock for ${{ matrix.env }} (s${hash}) on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/${GITHUB_REF_NAME}"
            git fetch -q origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::could not rebase lock commit for ${{ matrix.env }} — push it by hand or the reconciler will rebuild this env daily"
              exit 1
            fi
            sleep $(( attempt * 3 ))
          done
          echo "::error::exhausted push retries for ${{ matrix.env }}'s lock — the reconciler will keep rebuilding it until this lands"
          exit 1

      # Last, because it is the only step that changes nothing about the artifact.
      # Quay creates repos private; going public stays a deliberate opt-in (SAFETY note
      # at the top of this file). Whatever this step reports, the image is already built,
      # pushed and signed, so the fix is never to rebuild.
      #
      # This step's 403 hint used to say "re-mint the token in Quay", which was wrong and
      # cost real time: when it fired on 2026-09-04 the org already had an admin-scoped
      # token — the stale thing was the GitHub Actions SECRET, holding an older value.
      # Check the cheap, likely cause before the expensive, unlikely one.
      - name: Set repo public (only if explicitly requested)
        if: ${{ inputs.set_public == 'true' }}
        env:
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $QUAY_OAUTH_TOKEN" -H 'Content-Type: application/json' \
            -d '{"visibility":"public"}' \
            "https://quay.io/api/v1/repository/aarchsci/${{ matrix.env }}/changevisibility")"
          [ "$code" = "200" ] && { echo "public ✓"; exit 0; }
          echo "::error::changevisibility HTTP $code for ${{ matrix.env }} — image IS published+signed but still private."
          if [ "$code" = "403" ]; then
            echo "::error::403 = the QUAY_OAUTH_TOKEN this workflow received is not admin-scoped on the aarchsci org. Check in this order:"
            echo "::error::  1. Is the SECRET stale? Compare \`gh secret list\` against the working token in .env; if .env's token can flip a repo public locally, just re-set the secret from it. This was the actual cause on 2026-09-04."
            echo "::error::  2. Does the secret have a trailing newline? Set it with --body \"\$(...)\", not a stdin redirect — a newline fails with this same 403."
            echo "::error::  3. Only if both check out, re-mint in Quay (Applications -> Generate Token) with repo:admin."
            echo "::error::In every case the image for ${{ matrix.env }} is published and signed already; flip visibility and move on, do not rebuild."
          fi
          exit 1
