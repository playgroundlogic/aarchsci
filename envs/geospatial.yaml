# aarch.science — geospatial environment (v1)
# The fieldwork/BuckAI CPU-prep stack. Validated to solve native arm64 on
# conda-forge (123 pkgs). Versions left to the channel's current; the reconciler
# pins + rebuilds on change. Headline packages get import + functional smoke tests.
#
# Why rasterio resolves to 1.5.0 here and not 1.5.1 (measured 2026-09-04)
# ----------------------------------------------------------------------
# Nothing in this file pins it. rasterio 1.5.1 carries an upstream fix for NumPy 2.5
# deprecation warnings (rasterio#3592 / #3597) and IS available for linux-aarch64, but
# the solve cannot reach it today. The chain, verified by bisecting real solves:
#
#   1. rasterio 1.5.1's only builds require `libgdal-core >=3.13.2,<3.14`.
#   2. `fiona` 1.10.1 has no build against the 3.13.2 line at all — its builds pin
#      `>=3.12.1,<3.13` (build _6) then jump straight to `>=3.13.3,<3.14` (build _7,
#      uploaded 2026-09-03). So fiona + rasterio 1.5.1 forces libgdal-core 3.13.3.
#   3. conda-forge migrated giflib 5 -> 6; every gdal build from 3.13.2 build _3
#      (2026-08-15) onward requires `giflib >=6.1.3`.
#   4. `scikit-image` -> `tifffile` -> `imagecodecs`, and imagecodecs' newest build
#      (2026.8.16) still pins `giflib >=5.2.2,<5.3` — it has not been rebuilt for the
#      giflib 6 migration. So giflib 6 and scikit-image are mutually exclusive.
#
# The only joint solution is to fall back to the newest gdal still built against
# giflib 5 that fiona has a build for — 3.12.4 — which caps rasterio at 1.5.0.
# Confirmed: dropping `fiona` alone solves to gdal 3.13.2 + rasterio 1.5.1 + scikit-image.
#
# So this is NOT an arm64 gap (it reproduces on any subdir) and there is no spec change
# that fixes it — adding a `rasterio >=1.5.1` or `gdal >=3.13.2` floor makes the env
# UNSOLVABLE rather than newer. It clears itself when either imagecodecs is rebuilt for
# giflib 6 or fiona gets a 3.13.2-line build; the reconciler will pick that up on its own.
# Until then the practical exposure is warnings only, on a NumPy we do not yet ship.
name: geospatial
channels:
  - conda-forge
dependencies:
  - python >=3.11
  - gdal
  - proj
  - geos
  - rasterio
  - fiona
  - shapely
  - pyproj
  - scikit-image
  - numpy
