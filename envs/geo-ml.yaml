# aarch.science — geo-ml environment
# The geospatial base + classic CPU machine-learning on geospatial / tabular data
# (DESIGN D2). scikit-learn / xgboost / lightgbm for modeling; geopandas / pysal
# for vector + spatial statistics; datashader for large-scale rasterization.
# CPU-bound training/inference is the strongest Graviton price/perf case (D4: GPU
# is out — this is deliberately the CPU ML stack).
# Versions left to the channel's current; the reconciler pins + rebuilds on change.
#
# rasterio resolves to 1.5.0, not 1.5.1, for the same reason as `geospatial` — a
# fiona/imagecodecs/giflib-6 interaction upstream, not an arm64 gap and not fixable by a
# spec pin. The full measured chain is documented in envs/geospatial.yaml.
name: geo-ml
channels:
  - conda-forge
dependencies:
  - python >=3.11
  # --- geospatial base (mirrors envs/geospatial.yaml) ---
  - gdal
  - proj
  - geos
  - rasterio
  - fiona
  - shapely
  - pyproj
  - scikit-image
  - numpy
  # --- the geo-ml layer ---
  - geopandas
  - pysal
  - scikit-learn
  - xgboost
  - lightgbm
  - statsmodels
  - pandas
  - datashader
  # --- SciPy's own test suite (issue #45) ---
  # conda-forge ships SciPy's tests as a SEPARATE output, so `scipy.test()` in an image
  # without it finds 0 test files. scipy-tests is pinned by its own dependency to the
  # exact scipy build installed, and unlike nilearn's test deps (#43) it brings pytest and
  # hypothesis with it, so the suite is genuinely runnable. Measured on aarch64: the full
  # "fast" suite is 76,421 passed, 0 failed in 4 min. geo-ml.smoke.py runs the linalg and
  # special subsets (~19,400 tests, ~24 s) on every build — linalg because it is SciPy's
  # own coverage of the BLAS/LAPACK layer, the native code most likely to break on a new
  # architecture. Reproducing upstream's suite beats any check we could write ourselves.
  - scipy-tests
