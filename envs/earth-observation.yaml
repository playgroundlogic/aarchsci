# aarch.science — earth-observation environment (v2)
# The geospatial base + the labeled-array / lazy / STAC layer EO workflows need
# (DESIGN D2). xarray/dask/rioxarray for n-dimensional raster analysis at scale;
# stackstac/pystac-client/odc-stac for pulling STAC catalogs into xarray.
# Versions left to the channel's current; the reconciler pins + rebuilds on change.
# Headline packages get import + functional smoke tests (D3).
#
# rasterio resolves to 1.5.0, not 1.5.1, for the same reason as `geospatial` — a
# fiona/imagecodecs/giflib-6 interaction upstream, not an arm64 gap and not fixable by a
# spec pin. The full measured chain is documented in envs/geospatial.yaml.
name: earth-observation
channels:
  - conda-forge
dependencies:
  - python >=3.11
  # --- geospatial base (mirrors envs/geospatial.yaml) ---
  - gdal
  - proj
  - geos
  - rasterio
  - fiona
  - shapely
  - pyproj
  - scikit-image
  - numpy
  # --- the earth-observation layer ---
  - xarray
  - dask
  - rioxarray
  - stackstac
  - pystac-client
  - odc-stac
  - netcdf4
  - zarr
  - bottleneck
  # --- AWS access (issue #48) ---
  # This image's main targets (Earth Search STAC, Sentinel/Landsat COGs) live on S3, so
  # boto3 is a common next install — and before this line it could not be installed into
  # the env at all. Every botocore release requires `python-dateutil <3.0.0`, while this
  # env's unconstrained solve had moved to dateutil 4.0.0 (since 2026-11-01), so
  # `pip/micromamba install boto3` hit an unsolvable conflict. Declaring boto3 here lets
  # botocore hold dateutil below 3 itself, which is the honest form of that pin — a bare
  # `python-dateutil <3` would read as arbitrary with nothing in the env needing it.
  # Measured: 245 -> 250 packages (boto3, botocore, jmespath, s3transfer, six) with
  # dateutil 4.0.0 -> 2.9.0.post0 and NOTHING else moving. pandas and pystac-client work
  # with 2.9, as astro and geo-ml (which already carry botocore via s3fs) show.
  - boto3
  # --- SciPy's own test suite (issue #54) ---
  # D3 runs SciPy's linalg + special subsets (~19,400 tests, ~24 s) on every build, because
  # this env leans on scipy's COMPILED paths and upstream's suite at upstream's tolerances
  # beats any check we could write. scipy-tests is a separate conda-forge output pinned to
  # the exact scipy build installed, and brings pytest + hypothesis with it. Measured when
  # added: purely additive, no package changed version. Same shape as geo-ml (#45).
  - scipy-tests
