# aarch.science — comp-chem environment
# Computational chemistry: cheminformatics + molecular dynamics + quantum chemistry
# (DESIGN D2). rdkit for cheminformatics; openmm for MD; pyscf for quantum chemistry;
# ase for atomistic simulation; mdanalysis/mdtraj for trajectory analysis; openbabel
# + pdbfixer + parmed for structure prep. (xtb was REMOVED 2026-10-18 — see below.) All
# CPU-bound — a strong Graviton price/perf case (D4: GPU out, this is the CPU stack).
# All 13 candidates probe-verified to solve native arm64 on conda-forge.
# Versions left to the channel's current; the reconciler pins + rebuilds on change.
name: comp-chem
channels:
  - conda-forge
dependencies:
  - python >=3.11
  - numpy
  - scipy
  - pandas
  # --- cheminformatics ---
  - rdkit
  - openbabel
  # --- molecular dynamics + trajectory analysis ---
  - openmm
  - mdanalysis
  - mdtraj
  - parmed
  - pdbfixer
  # --- quantum / atomistic ---
  - ase
  - pyscf
  # xtb / xtb-python REMOVED 2026-10-18 (issue #46): conda-forge's linux-aarch64 xtb
  # computes WRONG ANALYTIC GRADIENTS while its energies are exactly right. Water from
  # xtb's own test_gfn2.f90: energy -5.070451354837 Eh (upstream pin -5.070451355118),
  # gradient norm 0.134752 against upstream's pinned 0.006457420125 — 21x too large, with
  # the oxygen z-component of the opposite sign. Confirmed on aarch64 with NO x86
  # reference: finite differences of arm64's own (correct) energies give 0.006457530.
  #
  # It cannot be pinned around. All seven aarch64 builds — 6.6.1 hcad76a7_0 and every
  # 6.7.1 build (h0fb133d_0/_1/_2, ha9b52fb_3, hfc05e43_4, gfortran_hcd2ce30_5) — return a
  # bit-identical 0.134752018160, so it is not a 6.7.1 regression. The feedstock
  # cross-compiles aarch64 and never runs the upstream unit tests there, which is how it
  # shipped. Tracked as conda-forge/xtb-feedstock#50.
  #
  # Why REMOVED rather than kept with a caveat, unlike `siesta` in `dft`: siesta fails
  # LOUDLY (it cannot run without pseudopotentials). xtb fails SILENTLY — plausible
  # energies, wrong forces — and geometry optimisation and MD are its main uses. Silent
  # wrong answers are exactly what D3 exists to keep out of a published image.
  #
  # Note the wrong gradient still sums to zero (6.9e-18), so a translational-invariance
  # check would NOT catch this. When it is re-added, the gate must compare against a
  # reference or a finite difference. Re-add when a fixed aarch64 build exists.
  # --- CPU-only enforcement: BOTH lines are load-bearing (D4) ---
  # Graviton has no NVIDIA GPU, so any CUDA package here is dead weight. conda-forge's
  # mechanism for that is the `__cuda` virtual package: a CUDA build should declare it,
  # and then a GPU-less host cannot select it. Two feedstocks in this env don't, and in
  # 2026-09 the channel drifted such that the solver picked CUDA builds of both —
  # adding ~800 MB of unreachable GPU code to a CPU image. Neither the solve nor the D3
  # smoke test can see this: nothing is broken, it is just wrong. Measured:
  #
  #   libxc-c 7.1.2 cuda_heee54e4_0   631 MB   vs  cpu_h2fc08b2_1    21 MB
  #   openmm  8.6.0 py313h37662f7_0   + cuda-nvrtc 38 MB + libcufft 151 MB
  #
  # libxc-c is the clearer bug: its build-NUMBER-1 CUDA builds DO declare `__cuda`
  # (so they are correctly excluded here), but the build-number-0 ones declare only
  # `cuda-version >=13.0,<14` — a freely-installable noarch metapackage — so they stay
  # selectable on a GPU-less host. `pyscf` 2.14.0 *requires* `libxc-c ... cuda_*`, so
  # the pin below is also why pyscf resolves to 2.13.1 (the `cpu_*`-flavored build,
  # bn=100) rather than 2.14.0. That downgrade is the price of not shipping 610 MB of
  # CUDA, and it is the right trade.
  - libxc-c=*=cpu_*
  # openmm needs the second line because its build strings carry NO cpu/cuda marker to
  # pin (`py313hc0cd0fd_0` is the CPU build, `py313h37662f7_0` the CUDA one, same build
  # number), so an exact pin would freeze both the openmm and the python version. This
  # instead states the env-wide policy once: no CUDA runtime. It is deliberately a
  # backstop as well as a fix — the regression above arrived by channel drift and will
  # again, possibly in a package that has no flavor marker either.
  #
  # Consequence to expect: `cuda-version 11.8` DOES appear in comp-chem.lock.txt. It is
  # a zero-payload noarch metapackage holding no CUDA code whatsoever — its only job is
  # to be the version that no GPU build here can accept. `ocl-icd`/`ocl-icd-system`
  # (0.1 MB) also remain: those are the OpenCL loader, which openmm's CPU build links
  # unconditionally, not CUDA.
  - cuda-version <12
  # psi4 was requested here (issue #2) but lives in `dft` instead. It is not a
  # packaging gap — psi4 1.11 is fine on arm64 — it is a python-version collision
  # measured in this env: psi4 1.11 has linux-aarch64 builds for py310/311/312/314
  # but NOT py313, and `xtb-python` (removed 2026-10-18) had no py314 build, so the only python where
  # both fit is 3.11. Forcing that here downgrades 13 packages (python 3.13->3.11,
  # numpy 2.5->2.4, scipy 1.18->1.17, hdf5 2.2->1.14, rdkit, pyscf, libboost).
  # `dft` already runs py314, so psi4 joins there for free. See envs/dft.yaml.
  #
  # --- docking ---
  # AutoDock Vina. NOTE THE NAME: conda-forge `vina`, NOT bioconda `autodock-vina`.
  # Different packages for the same program, and only `vina` has a linux-aarch64
  # build — searching the obvious name concludes AutoDock has no arm64 route and is
  # wrong (issue #2).
  #
  # It is not free, though. Measured by solving this env with and without it: vina adds
  # exactly ONE package but downgrades four, because vina 1.2.7's only aarch64 build
  # links boost 1.86 and rdkit has to follow it down:
  #   libboost 1.90.0 -> 1.86.0, libboost-python likewise,
  #   rdkit/librdkit 2026.03.5 -> 2026.03.1, eigen-abi 5.0.1.100 -> 3.4.0.100
  # Two patch releases of rdkit is a fair price for a docking engine; recorded here so
  # the next reader doesn't mistake it for unexplained staleness.
  - vina
  # --- thermochemistry, kinetics and transport (issue #38) ---
  # Cantera covers RATES, which nothing else in the catalog touches: equilibrium,
  # reaction kinetics, transport properties, 1-D flames. The rest of this env is
  # structure and energy (rdkit, openbabel, pyscf, openmm), so this is the
  # complement rather than an overlap.
  #
  # Costs nothing: measured, the env goes 207 -> 223 packages with python, rdkit and
  # everything else unchanged. Note the build that actually lands is `py313`, NOT the
  # py314 one issue #38 highlighted — this env resolves python 3.13.16 (psi4's old
  # py313 ceiling is why `psi4` lives in `dft` instead, see GAPS.md), and cantera 3.2.0
  # has aarch64 builds for py310 through py314, so it fits whatever this env's python is
  # rather than moving it.
  - cantera
