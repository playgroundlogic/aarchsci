# aarch.science — climate environment
# The xarray/dask array core + the atmospheric/climate-science stack (DESIGN D2).
# cartopy for projected mapping; cfgrib/eccodes for GRIB; metpy for meteorological
# calculations; xesmf/esmpy for regridding; netcdf4/zarr for storage. GRIB and
# regridding are the parts that are painful to pip-install and clean on conda-forge.
# Versions left to the channel's current; the reconciler pins + rebuilds on change.
name: climate
channels:
  - conda-forge
dependencies:
  - python >=3.11
  # --- array / lazy / storage core ---
  - numpy
  - xarray
  - dask
  - netcdf4
  - zarr
  - bottleneck
  - pandas
  # --- the climate / atmospheric layer ---
  - cartopy
  - cfgrib
  - eccodes
  - metpy
  # xesmf < 0.8.3 still does `import ESMF`; ESMF 8.4+ renamed that module to
  # `esmpy`. Without this floor the solver picks xesmf 0.6.0 against esmpy 8.9 and
  # the env solves but xesmf won't import (caught by the D3 smoke test). Pin to the
  # post-rename line so the resolver can't regress. See GAPS.md.
  - xesmf >=0.8.4
  - esmpy
  - cftime
  - pyproj
  # --- netCDF/GRIB command-line operators (issue #15) ---
  # cdo and nco are the CLI complement to the xarray/xesmf/metpy stack above: the
  # same data, a different and heavily-used interface (regrid, arithmetic, subsetting,
  # record concatenation, metadata surgery). They are compiled C/Fortran binaries,
  # effectively python-independent, and share climate's existing netcdf4/eccodes/hdf5.
  # No MPI question, and that is measured, not assumed: every arm64 build of both at
  # the current version is serial/OpenMP with no mpi dependency (checked all 6 files
  # of each), so they cannot introduce an MPI flavor into an env that has no MPI lock.
  # Joint solve confirmed: 249 -> 262 packages, python/xarray unchanged, no mpich or
  # openmpi pulled in. Verified by cdo.smoke work in climate.smoke.py section 4.
  - cdo
  - nco
  # --- ocean: seawater thermodynamics (issue #21) ---
  # gsw is the TEOS-10 Gibbs SeaWater toolbox. This env covered the atmosphere well
  # (metpy, eccodes, cdo/nco) and had no ocean equation of state; gsw is that, and it is
  # the standard one. Pure addition: joint solve moved no pin and kept python 3.14.
  #
  # It is also the cheapest strong verification in the catalog, because the package
  # ships its OWN published reference data: the official TEOS-10 check-value table is
  # inside the wheel at `gsw/tests/gsw_cv_v3_0.npz` (641,918 bytes, 822 arrays) with
  # committed per-function tolerances. So D3 reproduces a published number with ZERO
  # staged input and no network — the same standard as nwchem's basis sets and sssp's
  # pseudopotentials, rather than asserting a plausible-looking band.
  - gsw
